crons:
  - name: nightly-daily-report
    description: "Saves the daily sales report snapshot every night at 23:55 WIB"
    cron: "55 23 * * *"
    timezone: "Asia/Jakarta"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/v1/cron/daily-report"
    method: POST
    enabled: true
  - name: daily-backup
    description: "Creates an automatic daily database backup at 23:59 WIB and keeps the last 14"
    cron: "59 23 * * *"
    timezone: "Asia/Jakarta"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/v1/cron/backup"
    method: POST
    enabled: true
  - name: morning-whatsapp-summary
    description: "Sends the morning WhatsApp summary (due debts, expiring items) to the owner via Fonnte at 07:00 WIB"
    cron: "0 7 * * *"
    timezone: "Asia/Jakarta"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/v1/cron/morning-summary"
    method: POST
    enabled: true
